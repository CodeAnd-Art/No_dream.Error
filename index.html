<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liminal Survey - Paranoia Edition</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <audio id="bgMusic" autoplay loop>
            <source src="audio/9jackjack8-...w532668.mp3" type="audio/mpeg">
        </audio>

        <div class="survey-wrapper">
            <div class="image-container">
                <img id="liminialImage" src="" alt="Liminal Space" class="liminal-image">
            </div>

            <div class="question-container">
                <h1 id="questionText" class="paranoid-text"></h1>
                <p class="timer-text">Sonraki soru: <span id="timer">15</span>s</p>
            </div>

            <div class="response-container">
                <label class="response-option">
                    <input type="radio" name="answer" value="evet">
                    <span>Evet</span>
                </label>
                <label class="response-option">
                    <input type="radio" name="answer" value="hayır">
                    <span>Hayır</span>
                </label>
                <label class="response-option">
                    <input type="radio" name="answer" value="emin-değilim">
                    <span>Emin Değilim</span>
                </label>
            </div>

            <div class="progress">
                <p>Soru <span id="currentQuestion">1</span> / 25</p>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
